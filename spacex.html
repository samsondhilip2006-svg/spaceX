<!DOCTYPE html>
<html>
<head>
    <title>SpaceX</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
        }

        h1 {
            font-size: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: gray;
        }

        .hero {
            height: 500px;
            text-align: center;
            padding-top: 180px;
            background-image: url("space.jpg");
            background-size: cover;
            background-position: center;
        }

        .hero h2 {
            font-size: 45px;
        }

        .hero p {
            font-size: 20px;
            margin: 20px;
        }

        button {
            padding: 12px 25px;
            background-color: white;
            border: none;
            cursor: pointer;
        }

        .content {
            text-align: center;
            padding: 60px;
        }

        .content h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>SpaceX</h1>

        <nav>
            <a href="#">HOME</a>
            <a href="#">ROCKETS</a>
            <a href="#">MISSIONS</a>
            <a href="#">ABOUT</a>
        </nav>
    </header>

    <section class="hero">
        <h2>EXPLORE THE FUTURE</h2>
        <p>Making life multiplanetary</p>
        <button>LEARN MORE</button>
    </section>

    <section class="content">
        <h2>SpaceX Missions</h2>
        <p>SpaceX designs and launches advanced rockets and spacecraft.</p>
    </section>

</body>
</html>
